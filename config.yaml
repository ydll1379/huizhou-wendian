  寿县清真寺:      { city: 淮南, aliases: [寿州清真寺] }
  寿县古城墙:      { city: 淮南, aliases: [寿县城墙] }
  寿春城遗址:      { city: 淮南, aliases: [寿春城] }
  安丰塘:          { city: 淮南, aliases: [芍陂] }
  芜湖古城:        { city: 芜湖, aliases: [] }
