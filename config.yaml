# 徽州问典 —— 全局配置
# 所有路径均为相对项目根目录

llm:
  provider: deepseek
  api_key_env: DEEPSEEK_API_KEY   # 从环境变量读取 key（见 .env.example）
  base_url: https://api.deepseek.com
  model: deepseek-chat
  temperature: 0.3
  max_tokens: 1024

embedding:
  model: BAAI/bge-m3               # 中文 embedding，本地运行
  device: cpu                      # mac 可尝试 mps，不稳定则用 cpu
  batch_size: 16

reranker:
  model: BAAI/bge-reranker-v2-m3   # 重排序模型
  device: cpu
  trust_remote_code: true
  top_k: 5                         # 重排后返回给 LLM 的条数

retrieval:
  backend: local                   # local = 自研检索（默认）；weknora = 用 WeKnora 作检索后端（见文件末尾）
  top_k: 12                        # 召回阶段取回条数（混合检索融合后）
  baseline: false                  # true = 纯向量检索（做基线对比用），false = 混合检索+词表扩展
  bm25_weight: 0.5
  dense_weight: 0.5
  refuse_threshold: 0.35           # 最高相关度低于该值则拒答（防幻觉；local 后端口径）

chunking:
  max_chars: 500
  overlap: 80

data:
  raw_dir: data/raw                 # 原始文档目录（支持 .txt/.md/.html/.pdf/.docx）
  kb_dir: data/kb                   # 向量库持久化目录

# 领域词表：别名 -> 规范名（检索时做查询扩展，见 core/retriever.py）
domain_terms:
  合肥: [庐州, 庐阳, 庐江县, 霸都]
  包拯: [包公, 包希仁, 包龙图, 包青天, 包孝肃]
  逍遥津: [逍遥津公园, 张辽, 三国古战场]
  巢湖民歌: [巢湖, 大邵洋蛇灯]
  粉蜡笺: [粉蜡笺纸, 笺纸, 加工技艺]
  庐剧: [庐州戏, 倒七戏]
  三河古镇: [三河, 三河镇]
  李鸿章: [李中堂, 李文忠]

# 四城古称/别称（补充检索扩展）
  阜阳: [颍州]
  淮南: [寿州, 寿春]
  芜湖: [鸠兹]
  小甸集特支: [小甸集, 安徽第一面党旗]
  新四军: [铁军]
  金寨: [红军摇篮, 将军县]
  小岗村: [大包干, 红手印]

# 高德地图 LBS（Web服务 key，lbs.amap.com 免费申请）
amap:
  api_key_env: AMAP_API_KEY
  radius: 3000        # 周边搜索半径（米）
  food_limit: 6       # 美食推荐条数
  hotel_limit: 4      # 住宿推荐条数
  types:
    food: "050000"    # 餐饮服务
    hotel: "100000"   # 住宿服务

# 景点注册表：LBS 推荐锚点（知识库中已收录的景区/文保单位）
# aliases 用于从用户问题中识别景点（identify_spots）
