  包公园:          { city: 合肥, aliases: [包公祠, 包公墓, 清风阁, 包河, 浮庄, 包公文化园] }
  三河古镇:        { city: 合肥, aliases: [三河] }
  长临河古镇:      { city: 合肥, aliases: [长临河, 长临古街] }
  庐州府城隍庙:    { city: 合肥, aliases: [城隍庙] }
  紫蓬山:          { city: 合肥, aliases: [西庐寺] }
  渡江战役纪念馆:  { city: 合肥, aliases: [渡江纪念馆], tag: red }
  李鸿章故居:      { city: 合肥, aliases: [李府, 李鸿章享堂, 李府春秋] }
  环城公园:        { city: 合肥, aliases: [翡翠项链] }
  太和文庙:        { city: 阜阳, aliases: [] }
  阜阳奎星楼:      { city: 阜阳, aliases: [奎星楼, 拐角楼, 三蓬塔] }
  阜阳文峰塔:      { city: 阜阳, aliases: [文峰塔] }
  寿州窑遗址:      { city: 淮南, aliases: [寿州窑, 寿县窑, 上窑镇] }
  侵华日军淮南罪证遗址: { city: 淮南, aliases: [大通万人坑, 万人坑, 大通万人坑教育馆], tag: red }
  安徽第一面党旗纪念园: { city: 淮南, aliases: [安徽第一面党旗, 小甸村, 小甸集特支, 党旗纪念园, 小甸集, 寿县革命烈士陵园], tag: red }
  淮南新四军纪念林景区: { city: 淮南, aliases: [新四军纪念林], tag: red }
  板张集革命烈士陵园:  { city: 淮南, aliases: [板张集], tag: red }
  三里沟抗日纪念园:    { city: 淮南, aliases: [三里沟], tag: red }
  瓦埠暴动旧址:        { city: 淮南, aliases: [瓦埠暴动], tag: red }
  廖家湾革命纪念馆:    { city: 淮南, aliases: [廖家湾], tag: red }
  金寨红军广场:        { city: 六安, aliases: [金寨, 红军广场, 金寨县革命博物馆, 金寨革命烈士陵园, 将军县], tag: red }
  小岗村:              { city: 滁州, aliases: [大包干纪念馆, 小岗, 沈浩], tag: red }
